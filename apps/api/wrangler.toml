# Wrangler config — apps/api
# Three environments: dev (local), staging, production.
# Secrets (DATABASE_URL, JWT_SIGNING_KEY, RESEND_API_KEY, NETGSM_*, META_WHATSAPP_*, GOOGLE_OAUTH_*) are
# managed via `wrangler secret put` per env. Never commit secrets.

name = "dr-bak-api"
main = "src/interfaces/workers/fetch.ts"
compatibility_date = "2026-04-30"
compatibility_flags = ["nodejs_compat"]
account_id = ""  # filled per-environment via CI

# ---------- shared variables ----------
[vars]
LOG_LEVEL = "info"
DEFAULT_LOCALE = "tr"
SUPPORTED_LOCALES = "tr,ar,en,fr,es"
PUBLIC_BASE_URL = "https://uzmdroguzbak.com"
APP_BASE_URL = "https://uzmdroguzbak.com"
SLOT_HOLD_TTL_SECONDS = "300"
TOKEN_ACCESS_TTL_SECONDS = "900"
TOKEN_REFRESH_TTL_SECONDS = "1209600"  # 14 days
RATE_LIMIT_ANON_RPM = "60"
RATE_LIMIT_AUTH_RPM = "600"
RATE_LIMIT_LOGIN_PER_15M = "5"
CONSENT_DOCUMENT_VERSION = "v1.2026-04"
CLINIC_TIMEZONE = "Europe/Istanbul"
DEFAULT_SLOT_DURATION_MINUTES = "40"
TMS_SCREENING_VALIDITY_DAYS = "365"
APPOINTMENT_RESCHEDULE_WINDOW_HOURS = "24"
APPOINTMENT_CANCEL_WINDOW_HOURS = "24"

# ---------- DEV environment ----------
[env.dev]
workers_dev = true
[env.dev.vars]
ENVIRONMENT = "dev"
LOG_LEVEL = "debug"
PUBLIC_BASE_URL = "http://localhost:4321"
APP_BASE_URL = "http://localhost:4321"

# Bindings: KV
[[env.dev.kv_namespaces]]
binding = "KV_SESSIONS"
id = "e6e7349e10b8411ba2246584632bee0b"
[[env.dev.kv_namespaces]]
binding = "KV_RATELIMIT"
id = "0ab87d1999f642efb3324981cffc9a93"
[[env.dev.kv_namespaces]]
binding = "KV_IDEMPOTENCY"
id = "7c6592a945304323bc9ef3d205166670"
[[env.dev.kv_namespaces]]
binding = "KV_CACHE"
id = "7a6a568016db4040868ea6f48f857b73"

# Bindings: R2
[[env.dev.r2_buckets]]
binding = "R2_DOCUMENTS"
bucket_name = "drbak-documents-dev"
[[env.dev.r2_buckets]]
binding = "R2_MEDIA"
bucket_name = "drbak-media-dev"

# Bindings: Durable Objects
[[env.dev.durable_objects.bindings]]
name = "DOCTOR_DAY_LOCK"
class_name = "DoctorDayLock"

# Bindings: Queues — producers
[[env.dev.queues.producers]]
queue = "drbak-notifications-dev"
binding = "QUEUE_NOTIFICATIONS"

[[env.dev.queues.producers]]
queue = "drbak-webhooks-dev"
binding = "QUEUE_WEBHOOKS"

# Bindings: Queues — consumers
[[env.dev.queues.consumers]]
queue = "drbak-notifications-dev"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 5
dead_letter_queue = "drbak-notifications-dlq-dev"

[[env.dev.queues.consumers]]
queue = "drbak-webhooks-dev"
max_batch_size = 5
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "drbak-webhooks-dlq-dev"

# Bindings: Hyperdrive
[[env.dev.hyperdrive]]
binding = "HYPERDRIVE_DB"
id = "ed23da9987524f88910c36b754ffc22e"

# Cron triggers
[env.dev.triggers]
crons = [
  "*/5 * * * *",     # appointment reminder dispatcher (T-24h, T-1h)
  "0 3 * * *",       # daily KVKK audit-log archival
  "*/10 * * * *"     # expired slot-hold reaper (also done lazily on read)
]

# ---------- DO migrations (shared across envs) ----------
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DoctorDayLock"]

# ---------- STAGING environment ----------
[env.staging]
workers_dev = true
# Routes attach once DNS is cut over to CF (LAUNCH-CHECKLIST §A4). Until then
# staging is at dr-bak-api-staging.<account>.workers.dev.
# routes = [{ pattern = "staging-api.uzmdroguzbak.com/*", zone_name = "uzmdroguzbak.com" }]
[env.staging.vars]
ENVIRONMENT = "staging"
LOG_LEVEL = "info"
PUBLIC_BASE_URL = "https://dr-bak-web-staging.pages.dev"
APP_BASE_URL = "https://dr-bak-web-staging.pages.dev"
# OAuth redirect URI is built from `${API_BASE_URL}/api/v1/auth/oauth/google/callback`.
# Pointing this at the WEB origin (not the workers.dev API host) routes the
# callback through the same-origin reverse proxy in `apps/web/src/pages/api/[...path].ts`,
# so the auth cookies set by this Worker land on the same origin the SPA
# loads from. The matching redirect URI must also be registered in Google
# Cloud Console (https://console.cloud.google.com/apis/credentials → OAuth
# 2.0 Client IDs → Authorized redirect URIs). Replace with
# https://api.uzmdroguzbak.com once §A4 DNS cut-over lands.
API_BASE_URL = "https://dr-bak-web-staging.pages.dev"

[[env.staging.kv_namespaces]]
binding = "KV_SESSIONS"
id = "5c55ff12e7ae4e30aac2cd0ff148b185"
[[env.staging.kv_namespaces]]
binding = "KV_RATELIMIT"
id = "d40186a1a1c34088b92686d673b29971"
[[env.staging.kv_namespaces]]
binding = "KV_IDEMPOTENCY"
id = "519edf4d13b141ab97e23d3e8741726f"
[[env.staging.kv_namespaces]]
binding = "KV_CACHE"
id = "639db512301a4aeaa4815d704ebce983"

[[env.staging.r2_buckets]]
binding = "R2_DOCUMENTS"
bucket_name = "drbak-documents-staging"
[[env.staging.r2_buckets]]
binding = "R2_MEDIA"
bucket_name = "drbak-media-staging"

[[env.staging.durable_objects.bindings]]
name = "DOCTOR_DAY_LOCK"
class_name = "DoctorDayLock"

[[env.staging.queues.producers]]
queue = "drbak-notifications-staging"
binding = "QUEUE_NOTIFICATIONS"
[[env.staging.queues.producers]]
queue = "drbak-webhooks-staging"
binding = "QUEUE_WEBHOOKS"

[[env.staging.queues.consumers]]
queue = "drbak-notifications-staging"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 5
dead_letter_queue = "drbak-notifications-dlq-staging"
[[env.staging.queues.consumers]]
queue = "drbak-webhooks-staging"
max_batch_size = 5
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "drbak-webhooks-dlq-staging"

[[env.staging.hyperdrive]]
binding = "HYPERDRIVE_DB"
id = "ed23da9987524f88910c36b754ffc22e"

[env.staging.triggers]
crons = ["*/5 * * * *", "0 3 * * *", "*/10 * * * *"]

# ---------- PRODUCTION environment ----------
[env.production]
routes = [{ pattern = "api.uzmdroguzbak.com/*", zone_name = "uzmdroguzbak.com" }]
[env.production.vars]
ENVIRONMENT = "production"
LOG_LEVEL = "info"

[[env.production.kv_namespaces]]
binding = "KV_SESSIONS"
id = "29655459014b4f04acad62defd0cf4d2"
[[env.production.kv_namespaces]]
binding = "KV_RATELIMIT"
id = "4bf0d63164494b1aafa872940cf75f78"
[[env.production.kv_namespaces]]
binding = "KV_IDEMPOTENCY"
id = "0f70f4a899fc4114b3957a7d6d5ee8a9"
[[env.production.kv_namespaces]]
binding = "KV_CACHE"
id = "14c24f16c5ff4070ba18a9651a5f96a0"

[[env.production.r2_buckets]]
binding = "R2_DOCUMENTS"
bucket_name = "drbak-documents"
[[env.production.r2_buckets]]
binding = "R2_MEDIA"
bucket_name = "drbak-media"

[[env.production.durable_objects.bindings]]
name = "DOCTOR_DAY_LOCK"
class_name = "DoctorDayLock"

[[env.production.queues.producers]]
queue = "drbak-notifications"
binding = "QUEUE_NOTIFICATIONS"
[[env.production.queues.producers]]
queue = "drbak-webhooks"
binding = "QUEUE_WEBHOOKS"

[[env.production.queues.consumers]]
queue = "drbak-notifications"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 5
dead_letter_queue = "drbak-notifications-dlq"
[[env.production.queues.consumers]]
queue = "drbak-webhooks"
max_batch_size = 5
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "drbak-webhooks-dlq"

[[env.production.hyperdrive]]
binding = "HYPERDRIVE_DB"
id = "08c7b113f81b495cbec2e32fcaad0bb4"

[env.production.triggers]
crons = ["*/5 * * * *", "0 3 * * *", "*/10 * * * *"]

# ---------- Observability ----------
[observability]
enabled = true
head_sampling_rate = 1.0

# Secrets to set per env (NOT in this file):
#   DATABASE_URL
#   JWT_SIGNING_PRIVATE_KEY     (ES256 PEM)
#   JWT_SIGNING_PUBLIC_KEY      (ES256 PEM)
#   JWT_SIGNING_KID             (current key id; rotate quarterly)
#   RESEND_API_KEY
#   NETGSM_USERNAME
#   NETGSM_PASSWORD
#   NETGSM_SENDER_ID            (must be İYS-registered)
#   TWILIO_ACCOUNT_SID
#   TWILIO_AUTH_TOKEN
#   TWILIO_FROM_NUMBER
#   META_WA_ACCESS_TOKEN
#   META_WA_PHONE_NUMBER_ID
#   META_WA_VERIFY_TOKEN        (for incoming webhooks)
#   GOOGLE_OAUTH_CLIENT_ID
#   GOOGLE_OAUTH_CLIENT_SECRET
#   JITSI_APP_ID                (for telehealth signed-room JWT)
#   JITSI_APP_SECRET
#   ADMIN_BOOTSTRAP_EMAIL       (one-time bootstrap admin)
